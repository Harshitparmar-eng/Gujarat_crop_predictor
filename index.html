<!DOCTYPE html>
<html>
<head>
<title>Smart Crop Yield Predictor - Gujarat Pro</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    font-family: Arial;
    background: linear-gradient(to right,#0f2027,#203a43,#2c5364);
    color:white;
    text-align:center;
}
.container{
    width:95%;
    margin:auto;
    padding:15px;
}
input,select{
    width:90%;
    padding:8px;
    margin:6px;
    border-radius:5px;
    border:none;
}
button{
    padding:10px 20px;
    background:#27ae60;
    color:white;
    border:none;
    border-radius:5px;
}
.output{
    margin-top:20px;
    background:#1abc9c;
    padding:15px;
    border-radius:10px;
}
canvas{
    background:white;
    border-radius:10px;
    margin-top:15px;
}
</style>
</head>

<body>

<h2>🌾 Smart Crop Yield Predictor - Gujarat Pro</h2>

<div class="container">

<select id="crop">
<option value="">Select Crop</option>
<option value="wheat">Wheat</option>
<option value="rice">Rice</option>
<option value="groundnut">Groundnut</option>
<option value="cotton">Cotton</option>
<option value="banana">Banana</option>
<option value="cumin">Cumin</option>
</select>

<input type="number" id="area" placeholder="Farm Area (hectares)">
<input type="number" id="rainfall" placeholder="Rainfall (mm)">
<input type="number" id="ph" placeholder="Soil pH">
<input type="number" id="seed" placeholder="Seed Quality (1-5)">
<input type="number" id="market" placeholder="Market Distance (km)">

<button onclick="predict()">Predict</button>

<div class="output" id="result" style="display:none;">

<p id="yield"></p>
<p id="profit"></p>
<p id="health"></p>

<canvas id="yieldChart"></canvas>

</div>

</div>

<script>

function cropHealth(crop){

if(crop=="wheat")
return "🍞 Wheat: Good for heart health & diabetes control.";

if(crop=="rice")
return "🍚 Rice: Easy digestion, good for stomach problems.";

if(crop=="groundnut")
return "🥜 Groundnut: Rich in protein, helpful in weight gain & muscle building.";

if(crop=="banana")
return "🍌 Banana: Good for blood pressure & digestion.";

if(crop=="cumin")
return "🌿 Cumin: Helps in digestion & improves immunity.";

if(crop=="cotton")
return "Cotton is industrial crop (not food).";

}

let chart;

function predict(){

let crop=document.getElementById("crop").value;
let area=parseFloat(document.getElementById("area").value);
let rainfall=parseFloat(document.getElementById("rainfall").value);
let ph=parseFloat(document.getElementById("ph").value);
let seed=parseFloat(document.getElementById("seed").value);
let market=parseFloat(document.getElementById("market").value);

let yieldValue=((rainfall*0.02)+(seed*2))*area;
let profit=(yieldValue*2000)-(market*50);

document.getElementById("yield").innerHTML="🌾 Predicted Yield: "+yieldValue.toFixed(2)+" quintals";
document.getElementById("profit").innerHTML="💰 Estimated Profit: ₹ "+profit.toFixed(2);
document.getElementById("health").innerHTML="🏥 Health Benefit: "+cropHealth(crop);

document.getElementById("result").style.display="block";

if(chart) chart.destroy();

chart=new Chart(document.getElementById("yieldChart"),{
type:"bar",
data:{
labels:["Yield","Profit"],
datasets:[{
label:"Analysis",
data:[yieldValue,profit]
}]
}
});

}

</script>

</body>
</html>
